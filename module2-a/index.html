<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeletal Matrix Optimization & Kinetic Collisions</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: monospace; overflow: hidden; text-align: center; }
        #canvas { background: #222; display: block; margin: 0 auto; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .ui { position: absolute; top: 15px; width: 100%; pointer-events: none; font-size: 16px; font-weight: bold; text-shadow: 1px 1px 2px #000; }
        .controls { position: absolute; bottom: 15px; width: 100%; pointer-events: none; font-size: 12px; color: #aaa; }
    </style>
</head>
<body>

    <div class="ui">
        PLAYER: <span id="pHealth" style="color:#00ff00">100</span>% | 
        ENEMY: <span id="eHealth" style="color:#ff0000">100</span>%
    </div>
    <div class="controls">A / D to Move | W to Jump | Click & Drag Mouse to Punch/Kick Enemy</div>
    
    <canvas id="canvas"></canvas>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const gravity = 0.6;
        const groundY = canvas.height - 80;

        // Simplified character tracking states for performance
        let player = { x: canvas.width / 3, y: groundY - 50, vx: 0, vy: 0, health: 100, radius: 25, isGrounded: false };
        let enemy = { x: (canvas.width / 3) * 2, y: groundY - 50, vx: 0, vy: 0, health: 100, radius: 25, isGrounded: false };

        // Animation joint positions for ragdoll illusion
        let pJoints = { armX: 20, armY: 0, legX: 10, legY: 30 };
        let eJoints = { armX: -20, armY: 0, legX: -10, legY: 30 };

        // Mouse tracking for active hit vectors
        let mouseX = 0, mouseY = 0, isMouseDown = false;

        // Handle Keyboard Events
        let keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        // Handle Mouse Events for active combat tracking
        window.addEventListener('mousedown', e => { isMouseDown = true; mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        window.addEventListener('mouseup', () => isMouseDown = false);

        function updatePhysics(char) {
            char.y += char.vy;
            char.x += char.vx;
            char.vy += gravity;
            char.vx *= 0.85; // Friction constant

            // Ground boundary validation
            if (char.y >= groundY - char.radius) {
                char.y = groundY - char.radius;
                char.vy = 0;
                char.isGrounded = true;
            } else {
                char.isGrounded = false;
            }

            // Wall boundary checks
            if (char.x < char.radius) char.x = char.radius;
            if (char.x > canvas.width - char.radius) char.x = canvas.width - char.radius;
        }

        function runGameLoop() {
            // --- 1. PLAYER INPUT CONTROLS ---
            if (keys['KeyA']) player.vx = -6;
            if (keys['KeyD']) player.vx = 6;
            if (keys['KeyW'] && player.isGrounded) {
                player.vy = -14;
                player.isGrounded = false;
            }

            // --- 2. ENEMY FIGHTING AI ---
            // Simple logic tracker: Enemy moves towards player position
            let distanceX = player.x - enemy.x;
            if (Math.abs(distanceX) > 60) {
                enemy.vx = distanceX > 0 ? 3.5 : -3.5;
            } else {
                // Random attack jumps when near player
                if (Math.random() < 0.02 && enemy.isGrounded) {
                    enemy.vy = -12;
                }
            }

            // --- 3. MOUSE-DRAG RAGDOLL FIGHTING MECHANICS ---
            if (isMouseDown) {
                // Point arm toward mouse vector to execute physics punches
                let dx = mouseX - (player.x);
                let dy = mouseY - (player.y);
                let angle = Math.atan2(dy, dx);
                pJoints.armX = Math.cos(angle) * 35;
                pJoints.armY = Math.sin(angle) * 35;

                // Hit Detection: Checks if mouse hand intersects enemy hit-sphere
                let handX = player.x + pJoints.armX;
                let handY = player.y + pJoints.armY;
                let hx = handX - enemy.x;
                let hy = handY - enemy.y;
                let hitDist = Math.sqrt(hx * hx + hy * hy);

                if (hitDist < enemy.radius + 15 && enemy.health > 0) {
                    enemy.health -= 1; // Inflict impact value damage
                    enemy.vx += pJoints.armX * 0.4; // Push back enemy structure
                    enemy.vy -= 3;
                    document.getElementById('eHealth').innerText = Math.max(0, Math.floor(enemy.health));
                }
            } else {
                // Default joint bobbing while neutral
                let wave = Math.sin(Date.now() * 0.01);
                pJoints.armX = 20; pJoints.armY = 10 + wave * 5;
            }

            // --- 4. ENEMY COUNTER-ATTACK DETECTION ---
            let ex = enemy.x - player.x;
            let ey = enemy.y - player.y;
            let proximDist = Math.sqrt(ex * ex + ey * ey);

            if (proximDist < 70) {
                // Swing enemy arm at player coordinates
                let wave = Math.sin(Date.now() * 0.02);
                eJoints.armX = distanceX > 0 ? 25 : -25;
                eJoints.armY = wave * 20;

                if (Math.random() < 0.05 && player.health > 0) {
                    player.health -= 0.5;
                    player.vx += distanceX > 0 ? -4 : 4;
                    document.getElementById('pHealth').innerText = Math.max(0, Math.floor(player.health));
                }
            }

            // Move body structures
            updatePhysics(player);
            updatePhysics(enemy);

            // --- 5. RENDER THE COMBAT GRID ---
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Safety Arena Floor
            ctx.fillStyle = '#444';
            ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
            ctx.strokeStyle = '#0076ff';
            ctx.lineWidth = 4;
            ctx.beginPath(); ctx.moveTo(0, groundY); ctx.lineTo(canvas.width, groundY); ctx.stroke();

            // RENDER PLAYER (Blue Color Variant)
            if (player.health > 0) {
                ctx.strokeStyle = '#0076ff'; ctx.lineWidth = 6; ctx.fillStyle = '#0076ff';
                // Head
                ctx.beginPath(); ctx.arc(player.x, player.y - 30, 12, 0, Math.PI * 2); ctx.fill();
                // Spine / Torso
                ctx.beginPath(); ctx.moveTo(player.x, player.y - 18); ctx.lineTo(player.x, player.y + 10); ctx.stroke();
                // Active Arm Vector
                ctx.beginPath(); ctx.moveTo(player.x, player.y - 10); ctx.lineTo(player.x + pJoints.armX, player.y + pJoints.armY); ctx.stroke();
                // Ground Vectors (Legs)
                ctx.beginPath(); ctx.moveTo(player.x, player.y + 10); ctx.lineTo(player.x - 12, player.y + 28); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(player.x, player.y + 10); ctx.lineTo(player.x + 12, player.y + 28); ctx.stroke();
            }

            // RENDER ENEMY (Red Color Variant)
            if (enemy.health > 0) {
                ctx.strokeStyle = '#ff3333'; ctx.lineWidth = 6; ctx.fillStyle = '#ff3333';
                // Head
                ctx.beginPath(); ctx.arc(enemy.x, enemy.y - 30, 12, 0, Math.PI * 2); ctx.fill();
                // Spine / Torso
                ctx.beginPath(); ctx.moveTo(enemy.x, enemy.y - 18); ctx.lineTo(enemy.x, enemy.y + 10); ctx.stroke();
                // Active Attack Arm
                ctx.beginPath(); ctx.moveTo(enemy.x, enemy.y - 10); ctx.lineTo(enemy.x + eJoints.armX, enemy.y + eJoints.armY); ctx.stroke();
                // Legs
                ctx.beginPath(); ctx.moveTo(enemy.x, enemy.y + 10); ctx.lineTo(enemy.x - 12, enemy.y + 28); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(enemy.x, enemy.y + 10); ctx.lineTo(enemy.x + 12, enemy.y + 28); ctx.stroke();
            }

            // Handle Respawn Criteria
            if (player.health <= 0 || enemy.health <= 0) {
                ctx.fillStyle = '#ffffff'; ctx.font = '24px monospace';
                ctx.fillText(player.health <= 0 ? "GAME OVER - ENEMY WINS" : "VICTORY - ENEMY DESTROYED", canvas.width / 2 - 160, canvas.height / 2);
                ctx.font = '14px monospace';
                ctx.fillText("Refresh browser page to restart simulation index", canvas.width / 2 - 170, canvas.height / 2 + 40);
            }

            requestAnimationFrame(runGameLoop);
        }

        // Adjust resolution on screen flip/scale events
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });

        // Launch Application Instance
        runGameLoop();
    </script>
</body>
</html>
