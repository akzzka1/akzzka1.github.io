<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSE Comprehensive K-12+ Mathematics Assessment Engine</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #f4f6f8; color: #333; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 750px; margin: 30px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #d1d5db; text-align: left; }
        h1 { font-size: 22px; color: #0076ff; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-top: 0; }
        label { font-weight: bold; font-size: 14px; color: #4b5563; display: block; margin-bottom: 8px; }
        select { width: 100%; padding: 12px; font-size: 15px; font-family: monospace; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; margin-bottom: 20px; cursor: pointer; }
        .standard-tag { background: #e1effe; color: #1e429f; font-size: 12px; font-weight: bold; padding: 4px 8px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        .problem-box { background: #f9fafb; border-left: 4px solid #0076ff; padding: 20px; font-size: 18px; line-height: 1.6; margin-bottom: 20px; min-height: 80px; }
        button { background: #0076ff; color: white; border: none; padding: 12px 16px; font-size: 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 15px; }
        button:hover { background: #0056b3; }
        .submit-btn { background: #238636; }
        .submit-btn:hover { background: #2ea043; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; font-family: monospace; }
        .feedback { font-weight: bold; font-size: 16px; margin-top: 10px; min-height: 25px; }
        .back-link { display: inline-block; margin-top: 20px; color: #0076ff; text-decoration: none; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>GSE Target Standards Learning & Assessment Engine</h1>
        <p style="font-size: 13px; color: #666; margin-bottom: 20px;">Configure the selector node matrix below to target specific academic grade level algorithms.</p>
        
        <!-- COMPREHENSIVE K-12+ DROP-DOWN MENU -->
        <label for="gradeSelector">Select System Framework Parameter:</label>
        <select id="gradeSelector" onchange="updateGradeContext()">
            <option value="kindergarten">Kindergarten Framework (Cardinality & Counting)</option>
            <option value="grade1">Grade 1 Framework (Base Ten Addition)</option>
            <option value="grade2">Grade 2 Framework (Base Ten Subtraction)</option>
            <option value="grade3">Grade 3 Framework (Arithmetic Mastery)</option>
            <option value="grade4">Grade 4 Framework (Multi-Digit Operations)</option>
            <option value="grade5">Grade 5 Framework (Fractional Products)</option>
            <option value="grade6">Grade 6 Framework (Ratios & Percentages)</option>
            <option value="grade7">Grade 7 Framework (Rational Integers)</option>
            <option value="grade8">Grade 8 Framework (Linear Functions)</option>
            <option value="algebra1">High School Tier 1 (Algebra Vector Isolation)</option>
            <option value="geometry">High School Tier 2 (Geometric Dimension Assessment)</option>
            <option value="algebra2">High School Tier 3 (Polynomial Matrix Sets)</option>
            <option value="calculus">Advanced Placement / Higher Ed (Differential Calculus)</option>
        </select>

        <div id="standardLabel" class="standard-tag">Active Alignment Code: GSE-GK.CC.4</div>
        
        <button onclick="generateProblemMatrix()">Generate Dynamic Problem</button>

        <!-- PROBLEM AREA -->
        <div class="problem-box" id="problemDisplay">Select a system index parameter to run the calculations.</div>

        <!-- INPUT AND VALIDATION -->
        <input type="text" id="userAnswer" placeholder="Type your computed value result here...">
        <button class="submit-btn" onclick="checkAnswerQuery()">Submit Assessment Query</button>
        
        <div class="feedback" id="feedbackDisplay"></div>

        <a href="../" class="back-link">← Return to System Hub Menu</a>
    </div>

    <script>
        let currentTargetAnswer = null;

        window.onload = function() {
            updateGradeContext();
        };

        function updateGradeContext() {
            const selector = document.getElementById('gradeSelector').value;
            const label = document.getElementById('standardLabel');
            
            if (selector === 'kindergarten') label.innerText = "Active Alignment Code: GK.CC.4 (Cardinality Structures)";
            if (selector === 'grade1') label.innerText = "Active Alignment Code: MGSE1.NBT.4 (Base Ten Summation)";
            if (selector === 'grade2') label.innerText = "Active Alignment Code: MGSE2.NBT.5 (Fluency Deviations)";
            if (selector === 'grade3') label.innerText = "Active Alignment Code: MGSE3.OA.7 (Multiplication Properties)";
            if (selector === 'grade4') label.innerText = "Active Alignment Code: MGSE4.NBT.5 (Multi-Digit Factors)";
            if (selector === 'grade5') label.innerText = "Active Alignment Code: MGSE5.NF.4 (Fractional Quantities)";
            if (selector === 'grade6') label.innerText = "Active Alignment Code: MGSE6.RP.3 (Ratio Matrix & Percentages)";
            if (selector === 'grade7') label.innerText = "Active Alignment Code: MGSE7.NS.1 (Rational Signs Operations)";
            if (selector === 'grade8') label.innerText = "Active Alignment Code: MGSE8.EE.7 (Complex Linear Operations)";
            if (selector === 'algebra1') label.innerText = "Active Alignment Code: MGSE9-12.A.REI.3 (Single Variable Isolation)";
            if (selector === 'geometry') label.innerText = "Active Alignment Code: MGSE9-12.G.SRT.8 (Trigonometric Ratios)";
            if (selector === 'algebra2') label.innerText = "Active Alignment Code: MGSE9-12.A.APR.2 (Polynomial Remainder Theorem)";
            if (selector === 'calculus') label.innerText = "Advanced Placement Alignment: Calculus AB (Power Rule Derivative Elements)";
            
            generateProblemMatrix();
        }

        function generateProblemMatrix() {
            document.getElementById('userAnswer').value = "";
            document.getElementById('feedbackDisplay').innerText = "";
            const display = document.getElementById('problemDisplay');
            const selector = document.getElementById('gradeSelector').value;
            
            if (selector === 'kindergarten') {
                let dots = Math.floor(Math.random() * 6) + 4; // 4 to 9
                let symbolString = "● ".repeat(dots);
                display.innerHTML = `Count the absolute total structural matrix entities in the set:<br><br><span style="font-size: 24px; color: #0076ff;">${symbolString}</span>`;
                currentTargetAnswer = dots.toString();
            }
            else if (selector === 'grade1') {
                let base = Math.floor(Math.random() * 40) + 10;
                let add = Math.floor(Math.random() * 9) + 1;
                display.innerHTML = `Calculate the total base-ten summation value:<br><br><b>${base} + ${add} = ?</b>`;
                currentTargetAnswer = (base + add).toString();
            }
            else if (selector === 'grade2') {
                let base = Math.floor(Math.random() * 50) + 40;
                let sub = Math.floor(Math.random() * 25) + 5;
                display.innerHTML = `Compute the tracking baseline deduction array:<br><br><b>${base} - ${sub} = ?</b>`;
                currentTargetAnswer = (base - sub).toString();
            }
            else if (selector === 'grade3') {
                let factorA = Math.floor(Math.random() * 8) + 2;
                let factorB = Math.floor(Math.random() * 9) + 1;
                display.innerHTML = `Determine the missing factor variable value:<br><br><b>${factorA} &times; n = ${factorA * factorB}</b>`;
                currentTargetAnswer = factorB.toString();
            }
            else if (selector === 'grade4') {
                let valA = Math.floor(Math.random() * 40) + 11;
                let valB = Math.floor(Math.random() * 7) + 3;
                display.innerHTML = `Execute the compound multi-digit factors algorithm:<br><br><b>${valA} &times; ${valB} = ?</b>`;
                currentTargetAnswer = (valA * valB).toString();
            }
            else if (selector === 'grade5') {
                let num = Math.floor(Math.random() * 5) + 2;
                let den = num + Math.floor(Math.random() * 3) + 1;
                let whole = den * (Math.floor(Math.random() * 5) + 2);
                let answer = (num / den) * whole;
                display.innerHTML = `Evaluate the fractional structural product quantity:<br><br>What is <b>(${num}/${den})</b> of <b>${whole}</b>?`;
                currentTargetAnswer = answer.toString();
            }
            else if (selector === 'grade6') {
                let values =;
                let chosenPercent = values[Math.floor(Math.random() * values.length)];
                let baseNumber = (Math.floor(Math.random() * 5) + 1) * 100;
                let answer = (chosenPercent / 100) * baseNumber;
                display.innerHTML = `Calculate the targeted statistical percentage calculation:<br><br>What is <b>${chosenPercent}%</b> of <b>${baseNumber}</b>?`;
                currentTargetAnswer = answer.toString();
            }
            else if (selector === 'grade7') {
                let valA = (Math.floor(Math.random() * 15) + 5) * -1; // Negative integer
