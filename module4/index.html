<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSE Grade 8 Mathematics Core Curriculum Analyzer</title>
    <style>
        body { font-family: 'Courier New', Courier, monospace; background-color: #f4f6f8; color: #333; margin: 0; padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); border: 1px solid #d1d5db; text-align: left; }
        h1 { font-size: 22px; color: #0076ff; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; margin-top: 0; }
        label { font-weight: bold; font-size: 13px; color: #4b5563; display: block; margin-bottom: 6px; text-transform: uppercase; }
        select { width: 100%; padding: 12px; font-size: 14px; font-family: monospace; border: 1px solid #cbd5e1; border-radius: 4px; background: #fff; cursor: pointer; margin-bottom: 20px; }
        .standard-tag { background: #e1effe; color: #1e429f; font-size: 12px; font-weight: bold; padding: 6px 10px; border-radius: 4px; display: inline-block; margin-bottom: 15px; }
        .problem-box { background: #f9fafb; border-left: 4px solid #0076ff; padding: 25px; font-size: 18px; line-height: 1.6; margin-bottom: 20px; min-height: 100px; }
        button { background: #0076ff; color: white; border: none; padding: 12px 16px; font-size: 15px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-bottom: 15px; }
        button:hover { background: #0056b3; }
        .submit-btn { background: #238636; }
        .submit-btn:hover { background: #2ea043; }
        input[type="text"] { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; font-family: monospace; }
        .feedback { font-weight: bold; font-size: 16px; margin-top: 10px; min-height: 25px; }
        .back-link { display: inline-block; margin-top: 20px; color: #0076ff; text-decoration: none; font-size: 13px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1>GSE Grade 8 Target Standards Learning & Assessment Engine</h1>
        <p style="font-size: 12px; color: #666; margin-bottom: 25px;">Select an unblocked academic framework path variable below to initialize curriculum validation tasks.</p>
        
        <!-- GRADE 8 SPECIFIC DROPDOWN MENU -->
        <label for="masterAlgoSelector">Target Grade 8 Curriculum Node Matrix:</label>
        <select id="masterAlgoSelector" onchange="updateSystemLabel()">
            <optgroup label="The Number System (NS)">
                <option value="g8Rational">MGSE8.NS.1 - Unit 1: Rational vs. Irrational Numbers</option>
                <option value="g8Estimating">MGSE8.NS.2 - Unit 1: Approximating Square Roots</option>
            </optgroup>
            <optgroup label="Expressions & Equations (EE)">
                <option value="g8Exponents">MGSE8.EE.1 - Unit 2: Radical Exponent Laws</option>
                <option value="g8SquareRoots">MGSE8.EE.2 - Unit 2: Solving Equations with x²</option>
                <option value="g8Scientific">MGSE8.EE.3 - Unit 2: Scientific Notation Introduction</option>
                <option value="g8Equations">MGSE8.EE.7 - Unit 3: Linear Equation Sets</option>
            </optgroup>
            <optgroup label="Functions (F)">
                <option value="g8Functions">MGSE8.F.1 - Unit 4: Linear Input-Output Definitions</option>
                <option value="g8RateOfChange">MGSE8.F.4 - Unit 4: Finding Slope (y = mx + b)</option>
            </optgroup>
            <optgroup label="Geometry (G)">
                <option value="g8Pythag">MGSE8.G.7 - Unit 5: Pythagorean Triangles</option>
                <option value="g8Volume">MGSE8.G.9 - Unit 5: Cylinder and Cone Volumes</option>
            </optgroup>
            <optgroup label="Statistics & Probability (SP)">
                <option value="g8Scatter">MGSE8.SP.1 - Unit 6: Bivariate Data Scatter Plots</option>
            </optgroup>
        </select>

        <div id="standardLabel" class="standard-tag">Active Alignment Target: Initializing...</div>
        
        <button onclick="computeDynamicProblem()">Generate Dynamic Problem</button>

        <div class="problem-box" id="problemDisplay">Select a system unit code vector mapping row to begin.</div>

        <input type="text" id="userAnswer" placeholder="Type your final computed numerical answer value here...">
        <button class="submit-btn" onclick="validateUserResponse()">Submit Evaluation Matrix Query</button>
        
        <div class="feedback" id="feedbackDisplay"></div>

        <a href="../" class="back-link">← Return to System Hub Menu</a>
    </div>

    <script>
        let currentActiveAnswer = null;

        function updateSystemLabel() {
            const selector = document.getElementById('masterAlgoSelector');
            const selectedText = selector.options[selector.selectedIndex].text;
            const cleanCode = selectedText.split(' - ');
            document.getElementById('standardLabel').innerText = "Active Alignment Target: " + cleanCode[0];
            computeDynamicProblem();
        }

        function computeDynamicProblem() {
            document.getElementById('userAnswer').value = "";
            document.getElementById('feedbackDisplay').innerText = "";
            const display = document.getElementById('problemDisplay');
            const algo = document.getElementById('masterAlgoSelector').value;

            // --- THE NUMBER SYSTEM ---
            if (algo === "g8Rational") {
                let nums = ["0.333...", "5", "2/3", "√16", "√2"];
                let answers = ["rational", "rational", "rational", "rational", "irrational"];
                let idx = Math.floor(Math.random() * nums.length);
                display.innerHTML = `Classify the following numeric constant structure. Is it <b>rational</b> or <b>irrational</b>?<br><br><span style="font-size: 22px; color: #0076ff;"><b>${nums[idx]}</b></span><br><br>(Type exactly: <b>rational</b> or <b>irrational</b>)`;
                currentActiveAnswer = answers[idx];
            }
            else if (algo === "g8Estimating") {
                let roots =;
                let values = ["3 and 4", "4 and 5", "5 and 6", "7 and 8"];
                let idx = Math.floor(Math.random() * roots.length);
                display.innerHTML = `Approximate the value of the radical integer dimension:<br><br>Between which two whole numbers does <b>√${roots[idx]}</b> lie?<br><br>(Format note: Use the word 'and', e.g. type: <b>3 and 4</b>)`;
                currentActiveAnswer = values[idx];
            }

            // --- EXPRESSIONS & EQUATIONS ---
            else if (algo === "g8Exponents") {
                let base = Math.floor(Math.random() * 3) + 2;
                display.innerHTML = `Apply radical laws to simplify exponential sets into standard notation format:<br><br><b>(${base}<sup>5</sup>) &times; (${base}<sup>-3</sup>) = ${base}<sup>?</sup></b><br><br>Isolate only the missing exponent integer value.`;
                currentActiveAnswer = "2";
            }
            else if (algo === "g8SquareRoots") {
                let x = Math.floor(Math.random() * 4) + 4; // 4 to 7
                display.innerHTML = `Solve for the positive value of the variable asset x:<br><br><b>x<sup>2</sup> = ${x*x}</b>`;
                currentActiveAnswer = x.toString();
            }
            else if (algo === "g8Scientific") {
                let num = Math.floor(Math.random() * 8) + 1;
                let power = Math.floor(Math.random() * 2) + 3; // 10^3 or 10^4
                display.innerHTML = `Convert the tracking measurement expression into a standard whole integer value:<br><br><b>${num} &times; 10<sup>${power}</sup></b>`;
                currentActiveAnswer = (num * Math.pow(10, power)).toString();
            }
            else if (algo === "g8Equations") {
                let a = Math.floor(Math.random() * 5) + 2;
                let x = Math.floor(Math.random() * 6) + 2;
                let b = Math.floor(Math.random() * 10) + 1;
                display.innerHTML = `Isolate the linear balance variable expression parameter for x:<br><br><b>${a}x + ${b} = ${(a*x)+b}</b>`;
                currentActiveAnswer = x.toString();
            }

            // --- FUNCTIONS ---
            else if (algo === "g8Functions") {
                display.innerHTML = `Analyze the mapping coordinate coordinate pairs structure:<br><br>Does the set <b>{(1,2), (2,4), (3,6), (2,8)}</b> represent a valid mathematical function relationship?<br><br>(Type exactly: <b>yes</b> or <b>no</b>)`;
                currentActiveAnswer = "no";
            }
            else if (algo === "g8RateOfChange") {
                let m = Math.floor(Math.random() * 4) + 2; // slope
                let b = Math.floor(Math.random() * 5) + 1; // intercept
                let x1 = 1;
                let y1 = (m * x1) + b;
                let x2 = 2;
                let y2 = (m * x2) + b;
                display.innerHTML = `Find the rate of change (slope, <b>m</b>) for the linear data passing through coordinates:<br><br><b>(${x1}, ${y1})</b> and <b>(${x2}, ${y2})</b>`;
                currentActiveAnswer = m.toString();
            }

            // --- GEOMETRY ---
            else if (algo === "g8Pythag") {
                let mult = Math.floor(Math.random() * 3) + 1;
                display.innerHTML = `A right-angled triangle mesh array contains leg dimensions <b>a = ${3*mult}</b> and <b>b = ${4*mult}</b>. Using the Pythagorean theorem ($a^2 + b^2 = c^2$), solve for the hypotenuse vector length <b>c</b>.`;
                currentActiveAnswer = (5 * mult).toString();
            }
            else if (algo === "g8Volume") {
